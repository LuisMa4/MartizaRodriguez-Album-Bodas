<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Lora:ital,wght@0,400;0,500;1,400&display=swap">
<link rel="stylesheet" href="_ds/classical-191bb9a6-4a54-4149-b8f5-a649e226edd8/styles.css">
<script src="_ds/classical-191bb9a6-4a54-4149-b8f5-a649e226edd8/_ds_bundle.js"></script>
<style>
  html, body { margin: 0; padding: 0; background: #efe6d4; }
  a { color: #9c7226; text-decoration: none; }
  a:hover { color: #b68235; }
  ::selection { background: rgba(182,130,53,0.25); }
  @keyframes riseIn { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
  @keyframes pageIn { from { opacity: 0; transform: translateX(26px); } to { opacity: 1; transform: none; } }
  @keyframes hintPulse { 0%, 100% { opacity: 0.7; } 50% { opacity: 1; } }
</style>
</helmet>

<div style="position: relative; height: 100dvh; width: 100%; overflow: hidden; background: var(--color-bg); font-family: var(--font-body); color: var(--color-text); perspective: 2400px; perspective-origin: 50% 45%;">

  <div style="position: absolute; inset: 0; display: flex; flex-direction: column;">

    <div style="flex: none; display: flex; align-items: center; justify-content: space-between; gap: 18.4px; padding: 14px clamp(16px, 3vw, 40px) 12px; flex-wrap: wrap; row-gap: 10px; border-bottom: 1px solid var(--color-divider); background: var(--color-bg);">
      <img src="assets/logo-monograma.png" alt="Maritza Rodríguez" style="height: clamp(30px, 4.4vw, 40px); width: auto; display: block; flex: none;">
      <div style="display: flex; align-items: center; gap: clamp(10px, 1.6vw, 22px); flex-wrap: wrap; row-gap: 8px; justify-content: flex-end;">
        <sc-for list="{{ chapters }}" as="c" hint-placeholder-count="6">
          <button style="flex: none; padding: 4px 0; background: transparent; border: 0; border-bottom: 1px solid {{ c.rule }}; font-family: var(--font-heading); font-size: clamp(11px, 1.15vw, 13px); letter-spacing: 0.16em; text-transform: uppercase; color: {{ c.color }}; cursor: pointer; white-space: nowrap; transition: color 0.2s ease, border-color 0.2s ease;" style-hover="color: var(--color-accent-700); border-color: var(--color-accent-300);" onClick="{{ c.go }}">{{ c.title }}</button>
        </sc-for>
      </div>
    </div>

    <div style="flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden;" key="{{ pageKey }}">
      <div style="max-width: 1280px; margin: 0 auto; padding: 27.6px clamp(16px, 3vw, 40px) 120px; animation: pageIn 0.5s cubic-bezier(0.2,0.7,0.2,1) both;">

        <div style="display: flex; flex-direction: column; align-items: center; gap: 9.2px; padding: clamp(28px, 5vh, 56px) 0 clamp(34px, 6vh, 60px);">
          <div style="width: 1px; height: 42px; background: linear-gradient(to bottom, transparent, var(--color-accent));"></div>
          <span style="font-family: var(--font-heading); font-size: 14px; letter-spacing: 0.4em; color: var(--color-accent); font-variant-numeric: tabular-nums; padding-left: 0.4em;">{{ numeral }}</span>
          <h2 style="margin: 4.6px 0 0; font-family: var(--font-heading); font-weight: 400; font-size: clamp(36px, 6.6vw, 64px); line-height: 1; text-align: center; text-wrap: pretty; color: var(--color-text);">{{ title }}</h2>
          <div style="width: 128px; height: 1px; margin-top: 18.4px; background: var(--color-divider);"></div>
        </div>

        <div style="columns: {{ gridCols }}; column-gap: 10px;">
          <sc-for list="{{ photos }}" as="p" hint-placeholder-count="12">
            <figure style="margin: 0 0 10px; break-inside: avoid; animation: riseIn 0.6s cubic-bezier(0.2,0.7,0.2,1) both;">
              <div style="padding: 6px; background: var(--color-surface); border: 1px solid var(--color-divider); border-radius: var(--radius-sm); box-shadow: var(--shadow-sm); cursor: zoom-in; transition: box-shadow 0.25s ease, border-color 0.25s ease;" style-hover="box-shadow: var(--shadow-md); border-color: var(--color-accent-300);" onClick="{{ p.open }}">
                <img src="{{ p.src }}" alt="" loading="lazy" style="display: block; width: 100%; height: auto;">
              </div>
            </figure>
          </sc-for>
        </div>

        <div style="display: flex; align-items: center; justify-content: space-between; gap: 18.4px; margin-top: clamp(48px, 9vh, 88px); padding-top: 22px; border-top: 1px solid var(--color-divider);">
          <button style="padding: 10px 0; background: transparent; border: 0; font-family: var(--font-heading); font-size: 15px; letter-spacing: 0.1em; color: var(--color-accent-700); cursor: pointer; text-align: left; opacity: {{ prevOpacity }}; pointer-events: {{ prevPointer }};" style-hover="color: var(--color-accent-600);" onClick="{{ goPrev }}">‹ {{ prevTitle }}</button>
          <span style="flex: none; font-family: var(--font-heading); font-size: 12px; letter-spacing: 0.28em; color: var(--color-neutral-600); font-variant-numeric: tabular-nums;">{{ pageLabel }}</span>
          <button style="padding: 10px 0; background: transparent; border: 0; font-family: var(--font-heading); font-size: 15px; letter-spacing: 0.1em; color: var(--color-accent-700); cursor: pointer; text-align: right; opacity: {{ nextOpacity }}; pointer-events: {{ nextPointer }};" style-hover="color: var(--color-accent-600);" onClick="{{ goNext }}">{{ nextTitle }} ›</button>
        </div>

      </div>
    </div>
  </div>

  <div style="position: absolute; inset: 0; z-index: 40; transform-origin: left center; transform-style: preserve-3d; transition: transform 1.25s cubic-bezier(0.55,0.02,0.2,1), opacity 0.4s ease 0.95s; will-change: transform; background: #efe6d4; box-shadow: 26px 0 70px rgba(0,0,0,0.4); cursor: pointer; transform: {{ coverTransform }}; opacity: {{ coverOpacity }}; pointer-events: {{ coverPointer }};" onClick="{{ openCover }}">
    <div style="position: absolute; inset: 0; background-image: repeating-linear-gradient(58deg, rgba(255,255,255,0.5) 0 1px, transparent 1px 3px), repeating-linear-gradient(-32deg, rgba(120,96,54,0.09) 0 1px, transparent 1px 4px), radial-gradient(120% 90% at 50% 38%, #f7f0e2 0%, #eee4d1 48%, #ddd0b6 100%);"></div>
    <div style="position: absolute; inset: 0; background: radial-gradient(60% 45% at 50% 42%, rgba(255,255,255,0.5) 0%, transparent 68%);"></div>
    <div style="position: absolute; left: 0; top: 0; bottom: 0; width: 22px; background: linear-gradient(to right, rgba(146,118,66,0.28), rgba(255,255,255,0.55) 55%, rgba(146,118,66,0.12));"></div>
    <div style="position: absolute; inset: clamp(18px, 3.4vw, 40px); border: 1px solid rgba(150,108,38,0.5);"></div>
    <div style="position: absolute; inset: calc(clamp(18px, 3.4vw, 40px) + 7px); border: 1px solid rgba(150,108,38,0.22);"></div>

    <div style="position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18.4px; text-align: center; padding: 0 36.8px;">
      <div style="width: 54px; height: 1px; background: linear-gradient(to right, transparent, rgba(150,108,38,0.75), transparent);"></div>
      <img src="assets/logo-firma.png" alt="Maritza Rodríguez Fotografía" style="width: min(60vw, 620px); height: auto; display: block;">
      <div style="width: 54px; height: 1px; background: linear-gradient(to right, transparent, rgba(150,108,38,0.75), transparent);"></div>
      <span style="font-family: var(--font-heading); font-size: clamp(12px, 1.6vw, 16px); letter-spacing: 0.52em; text-transform: uppercase; color: rgba(120,88,36,0.85); padding-left: 0.52em;">Bodas</span>
    </div>

    <div style="position: absolute; left: 0; right: 0; bottom: clamp(38px, 7vh, 74px); display: flex; flex-direction: column; align-items: center; gap: 11px; animation: hintPulse 3.4s ease-in-out infinite;">
      <span style="font-family: var(--font-body); font-size: 11px; letter-spacing: 0.28em; text-transform: uppercase; color: #6b5326; padding-left: 0.28em;">Toca para abrir</span>
      <div style="width: 26px; height: 26px; border-right: 1px solid #9c7226; border-top: 1px solid #9c7226; transform: rotate(45deg) scale(0.72);"></div>
    </div>
  </div>

  <sc-if value="{{ lbOpen }}" hint-placeholder-val="{{ false }}">
    <div style="position: absolute; inset: 0; z-index: 60; background: rgba(24,20,14,0.95); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18.4px; padding: 27.6px; animation: riseIn 0.28s ease both;" onClick="{{ closeLb }}">
      {{ lbImage }}
      <div style="display: flex; align-items: center; gap: 27.6px;" onClick="{{ stop }}">
        <button style="width: 44px; height: 44px; display: grid; place-items: center; background: transparent; border: 1px solid rgba(226,184,114,0.45); border-radius: var(--radius-sm); color: #e2b872; font-family: var(--font-heading); font-size: 20px; cursor: pointer; transition: background 0.2s ease;" style-hover="background: rgba(182,130,53,0.16);" onClick="{{ prevLb }}">‹</button>
        <span style="font-family: var(--font-heading); font-size: 13px; letter-spacing: 0.3em; color: rgba(240,232,220,0.7); font-variant-numeric: tabular-nums;">{{ lbLabel }}</span>
        <button style="width: 44px; height: 44px; display: grid; place-items: center; background: transparent; border: 1px solid rgba(226,184,114,0.45); border-radius: var(--radius-sm); color: #e2b872; font-family: var(--font-heading); font-size: 20px; cursor: pointer; transition: background 0.2s ease;" style-hover="background: rgba(182,130,53,0.16);" onClick="{{ nextLb }}">›</button>
      </div>
    </div>
  </sc-if>

</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;tileMin&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:250,&quot;min&quot;:180,&quot;max&quot;:420,&quot;step&quot;:10,&quot;unit&quot;:&quot;px&quot;,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Catálogo&quot;}}">
const ROMAN = ['I', 'II', 'III', 'IV', 'V', 'VI', 'VII'];
const DIR = 'web/bodas/';

const CHAPTERS = [
  { title: 'Presesión', files: ['IMG_9923','IMG_0072','IMG_0216','IMG_1447','IMG_1461','IMG_1489','IMG_1534','IMG_1552','IMG_1563','IMG_1584','IMG_1635','IMG_1695','IMG_1762','IMG_1816','IMG_0058','IMG_0158','IMG_0167','IMG_1730','IMG_2692','IMG_3338','IMG_1496','IMG_1521','IMG_1583','IMG_1588','IMG_2384','IMG_3222','IMG_3255'] },
  { title: 'Ceremonia', files: ['IMG_4113','IMG_7378','IMG_4374','IMG_4220','IMG_4288','IMG_4488','IMG_7379','IMG_738','IMG_7346','IMG_7421','IMG_8522','IMG_8542','IMG_7003','IMG_7292','IMG_7285','IMG_7369','IMG_7413','IMG_8500','IMG_8577'] },
  { title: 'Sesión de pareja', files: ['IMG_3884','IMG_3891','IMG_3937','IMG_3942','IMG_3947','IMG_4000','IMG_4018','IMG_4076','IMG_7774','IMG_7778','IMG_7783','IMG_7824','IMG_6969','IMG_7093','IMG_7545','IMG_9803'] },
  { title: 'Familia y amigos', files: ['IMG_4141','IMG_7253','IMG_4366','IMG_7433','IMG_7927','IMG_8534','IMG_7405','IMG_7427','IMG_7459','IMG_7482','IMG_7496','IMG_1511','IMG_2342'] },
  { title: 'Recepción', files: ['IMG_7231','IMG_7658','IMG_7706','IMG_7826','IMG_8514','IMG_7362','IMG_7724','IMG_7734','IMG_7867'] },
  { title: 'Fiesta', files: ['IMG_7404','IMG_7687','IMG_7882','IMG_7887','IMG_7896','IMG_7897'] },
  { title: 'Detalles', files: ['IMG_7323','IMG_9731','IMG_7320'] },
];

class Component extends DCLogic {
  state = { open: false, ch: 0, lb: null };

  componentDidMount() {
    this._key = (e) => {
      if (!this.state.open) return;
      if (this.state.lb !== null) {
        if (e.key === 'Escape') this.setState({ lb: null });
        if (e.key === 'ArrowRight') this.stepLb(1);
        if (e.key === 'ArrowLeft') this.stepLb(-1);
        return;
      }
      if (e.key === 'ArrowRight') this.goCh(this.state.ch + 1);
      if (e.key === 'ArrowLeft') this.goCh(this.state.ch - 1);
    };
    window.addEventListener('keydown', this._key);
  }
  componentWillUnmount() { window.removeEventListener('keydown', this._key); }

  goCh(i) {
    if (i < 0 || i >= CHAPTERS.length) return;
    this.setState({ ch: i, lb: null });
  }

  stepLb(d) {
    const n = CHAPTERS[this.state.ch].files.length;
    this.setState((s) => ({ lb: s.lb === null ? null : (s.lb + d + n) % n }));
  }

  renderVals() {
    const min = this.props.tileMin ?? 250;
    const ch = this.state.ch;
    const chap = CHAPTERS[ch];
    const lb = this.state.lb;
    const prev = CHAPTERS[ch - 1];
    const next = CHAPTERS[ch + 1];

    return {
      chapters: CHAPTERS.map((c, i) => ({
        title: c.title,
        color: i === ch ? 'var(--color-accent-700)' : 'var(--color-neutral-600)',
        rule: i === ch ? 'var(--color-accent)' : 'transparent',
        go: () => this.goCh(i),
      })),
      photos: chap.files.map((f, i) => ({
        src: DIR + f + '.jpg',
        open: () => this.setState({ lb: i }),
      })),
      gridCols: min + 'px',
      pageKey: 'ch' + ch,
      numeral: ROMAN[ch],
      title: chap.title,
      pageLabel: String(ch + 1) + ' / ' + CHAPTERS.length,
      prevTitle: prev ? prev.title : '',
      nextTitle: next ? next.title : '',
      prevOpacity: prev ? 1 : 0,
      nextOpacity: next ? 1 : 0,
      prevPointer: prev ? 'auto' : 'none',
      nextPointer: next ? 'auto' : 'none',
      goPrev: () => this.goCh(ch - 1),
      goNext: () => this.goCh(ch + 1),
      coverTransform: this.state.open ? 'rotateY(-114deg)' : 'rotateY(0deg)',
      coverOpacity: this.state.open ? 0 : 1,
      coverPointer: this.state.open ? 'none' : 'auto',
      openCover: () => this.setState({ open: true }),
      lbOpen: lb !== null,
      lbImage: lb === null ? null : React.createElement('img', {
        src: DIR + chap.files[lb] + '.jpg', alt: '',
        style: { maxWidth: 'min(1100px, 92vw)', maxHeight: 'min(64dvh, 760px)', display: 'block', padding: 9.2, background: '#f3f2f2', boxShadow: '0 24px 70px rgba(0,0,0,0.6)' },
      }),
      lbLabel: lb === null ? '' : String(lb + 1).padStart(2, '0') + ' / ' + String(chap.files.length).padStart(2, '0'),
      closeLb: () => this.setState({ lb: null }),
      stop: (e) => e.stopPropagation(),
      prevLb: () => this.stepLb(-1),
      nextLb: () => this.stepLb(1),
    };
  }
}

</script>
</body>
</html>
